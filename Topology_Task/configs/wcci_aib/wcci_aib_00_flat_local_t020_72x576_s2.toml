# WCCI reduced-action MLP baseline with adaptive intervention-budget overlay.

[run]
name = "wcci_aib_00_flat_local_t020_72x576_s2"
run_dir = "outputs/jed-{config_name}-{job_id}"
seed_from_slurm_array = false
extra_args = []

[launcher]
use_srun = true
cpu_bind = "cores"
print_python_summary = true

[environment]
PYTHONUNBUFFERED = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
MAX_TIME_LIMIT_MINUTES = "10080"
MPLCONFIGDIR = "{run_dir}/matplotlib"
WANDB_DIR = "{run_dir}/wandb"
XDG_CACHE_HOME = "{run_dir}/cache"

[args]
# core
time_limit = 4320
checkpoint = true
alg = "MAPPO"
seed = 2
verbose = true
exp_tag = "wcci_aib_00_flat_local_t020_72x576_s2"
track = true
wandb_project = "Grid2Op"
wandb_entity = "corentin-plumet-epfl"
wandb_mode = "online"
th_deterministic = false
cuda = false
n_threads = 4

# environment
env_id = "bus36_wcci"
n_envs = 72
action_type = "topology" 
reduced_action_space = "outputs/teacher_student_datasets/wcci_full2048a_90_v3/metadata/reduced_action_space_wcci_full2048a_90_v3_mk256.json"
difficulty = 0
decentralized = true
n1_reward = false
env_config_path = "scenario.json"
norm_obs = true
use_heuristic = false
heuristic_type = "idle"
line_margin_reward_weight = 0.0
topology_reward_weight = 0.0
optimize_mem = true
constraints_type = 0
split_chronics = true
test_chronics_pct = 0.2
chronic_split_seed = 0

# encoders
actor_encoder = "mlp"
critic_encoder = "mlp"

# ppo
total_timesteps = 60000000
n_steps = 576
eval_freq = 82944
actor_layers = [256, 256, 256]
critic_layers = [256, 256, 256]
actor_act_fn = "relu"
critic_act_fn = "relu"
actor_lr = 0.0001
critic_lr = 0.0001
anneal_lr = true
gamma = 0.9
gae_lambda = 0.95
update_epochs = 10
n_minibatches = 16
max_grad_norm = 1.0
target_kl = 0.02
norm_adv = true
clip_coef = 0.2
clip_vfloss = true
entropy_coef = 0.01
vf_coef = 0.5
init_do_nothing_prob = 0.0
norm_reward = true
action0_logit_bonus_init = 0.0
action0_logit_bonus_final = 0.0
action0_logit_bonus_fraction = 1.0
deterministic_eval = true
eval_episodes = 10
eval_all_split_chronics = false
eval_train_chronics = true

# experiment overlay copied from a0_aib
adaptive_intervention_budget = true
intervention_budget_cost_mode = "local_safe"
intervention_budget_target = 0.20
intervention_budget_lr = 0.02
intervention_budget_rho_threshold = 0.90
intervention_budget_rho_sharpness = 25.0
