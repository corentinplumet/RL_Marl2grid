# WCCI flat-MLP-actor from-scratch baseline, mk32, seed 0.
# actor_encoder = mlp: no graph encoder at all, reading the flat observation.
# Derived from wsc_bus_e0n0v0_mk64_s0.toml with every graph setting
# removed and the action space re-capped; the environment, the 15M-step budget,
# the chronic split and every PPO setting are byte-identical, so the difference
# against the wsc screen is attributable to the encoder alone.

[run]
name = "wmlp_mk32_s0"
run_dir = "outputs/{config_name}-{job_id}"
seed_from_slurm_array = false
extra_args = []

[launcher]
use_srun = true
cpu_bind = "cores"
print_python_summary = true

[environment]
PYTHONUNBUFFERED = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
MAX_TIME_LIMIT_MINUTES = "4260"
MPLCONFIGDIR = "{run_dir}/matplotlib"
WANDB_DIR = "{run_dir}/wandb"
XDG_CACHE_HOME = "{run_dir}/cache"

[args]
# Paired bus14 screening protocol
time_limit = 4260
checkpoint = true
alg = "MAPPO"
seed = 0
verbose = true
exp_tag = "wmlp_mk32_s0"
track = true
wandb_project = "Grid2Op"
wandb_entity = "corentin-plumet-epfl"
wandb_mode = "online"
th_deterministic = false
cuda = false
n_threads = 4

# bus14 environment and fixed MLP critic
env_id = "bus36_wcci_nomaint"
reduced_action_space = "outputs/teacher_student_datasets/wcci_full2048a_90_v3/metadata/reduced_action_space_wcci_full2048a_90_v3_mk32.json"
# The screened encoders use the busbar / disaggregated schemas, so the
# candidate-action head is unavailable and the flat head scores the
# reduced space directly.
actor_action_head = "mlp"
n_envs = 72
action_type = "topology"
difficulty = 0
decentralized = true
n1_reward = false
env_config_path = "scenario.json"
norm_obs = true
use_heuristic = false
heuristic_type = "idle"
line_margin_reward_weight = 0.0
topology_reward_weight = 0.0
optimize_mem = true
constraints_type = 0
split_chronics = true
test_chronics_pct = 0.2
chronic_split_seed = 0

# Shared, grid-size-independent actor encoder
actor_encoder = "mlp"
critic_encoder = "mlp"
# No graph encoder exists to share.
share_actor_gnn = false

# Relation directions (held at the backwards-compatible baseline)

# Structural factors (held off in stage 1)

# Input preprocessing factors

# Training budget (overridden by later stages when required)
total_timesteps = 15000000
n_steps = 576
eval_freq = 82944
actor_layers = [128, 128]
critic_layers = [256, 256, 256]
actor_act_fn = "relu"
critic_act_fn = "relu"
actor_lr = 0.0001
critic_lr = 0.0001
anneal_lr = true
gamma = 0.9
gae_lambda = 0.95
update_epochs = 10
n_minibatches = 16
max_grad_norm = 1.0
target_kl = 0.02
norm_adv = true
clip_coef = 0.2
clip_vfloss = true
entropy_coef = 0.01
entropy_coef_final = 0.01
vf_coef = 0.5
optimize_critic_updates = true
init_do_nothing_prob = 0.0
norm_reward = true
action0_logit_bonus_init = 0.0
action0_logit_bonus_final = 0.0
action0_logit_bonus_fraction = 1.0
deterministic_eval = true
eval_episodes = 10
eval_all_split_chronics = false
eval_train_chronics = true

# No intervention mechanism is mixed into the representation screen
intervention_gate = false
intervention_gate_eval_mode = "final_action_map"
intervention_penalty = 0.0
safe_intervention_penalty = 0.0
safe_intervention_rho_threshold = 0.90
eval_action_heuristic = "none"
eval_action_rho_threshold = 0.90
